[project]
name = "specula"
version = "0.1.0"
description = "Intraday backtesting of Didi Index + Bollinger FFFD setups with vectorbt"
requires-python = ">=3.11,<3.15"
dependencies = [
    "vectorbt>=1.1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "polars>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas-market-calendars>=4.4",
    "python-dotenv>=1.0",
    "pandas-ta-classic",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.116",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specula"]

[tool.ruff]
line-length = 100
